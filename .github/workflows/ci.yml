name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: osa_test
          POSTGRES_PASSWORD: osa_test_password
          POSTGRES_DB: osa_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U osa_test -d osa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://osa_test:osa_test_password@localhost:5432/osa_test
      ADMIN_PASSWORD: ci_only_admin_password_2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker image
        run: docker build -t open-sales-assistant:test .

      - name: Run Docker smoke test
        run: |
          trap 'docker compose logs || true; docker compose down' EXIT
          docker compose up -d --build
          sleep 3
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:3100/api/health
